[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ode-paper-experiments"
version = "1.0.0"
description = "Reproducible transformer experiments for ODE inverse problems"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "torch>=2.8,<3", "matplotlib>=3.8,<4", "scipy>=1.11,<2"]

[project.optional-dependencies]
notebooks = ["nbformat>=5.10", "nbconvert>=7", "ipykernel>=6"]

[project.scripts]
ode-paper = "ode_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
